<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060a" />
    <!-- installable: "Add to Home Screen" opens it full screen and sideways, like an app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Eclipse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Eclipse: Fallen Gods - a cinematic fantasy action RPG." />
    <title>Eclipse: Fallen Gods</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07060a; touch-action: none; -webkit-user-select: none; user-select: none; }
      canvas#game { display: block; position: fixed; inset: 0; width: 100%; height: 100%; outline: none; }
      #fatal { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; color: #e8dcc0; font: 18px/1.5 serif; padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="ui"></div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
