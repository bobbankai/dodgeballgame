name: Publish the game
on:
  push:
    branches: [main, claude/trusting-sagan-1r3jce]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Eclipse: Fallen Gods is published beside it, at /eclipse/. A failed Eclipse build must not take the
      # other game's site down with it, so that step may fail and its folder is only added if it succeeded.
      - name: Build Eclipse
        id: eclipse
        continue-on-error: true
        run: npm run eclipse:build
      - name: Add Eclipse to the site
        if: steps.eclipse.outcome == 'success'
        run: cp -r dist-eclipse dist/eclipse
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
